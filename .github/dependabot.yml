# Dependabot: weekly version updates and security updates, one grouped PR per ecosystem and directory.
# Rendered by the clockgrove repository standard (~/work/ops/repo-standard.sh files) from the manifests here;
# render it again when a manifest or lockfile appears in a new directory.
version: 2
updates:
  - package-ecosystem: npm
    directory: /spikes/stevie-3d
    schedule:
      interval: weekly
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: clockgrove/factory
