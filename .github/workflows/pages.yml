# The quality lab's public page (raccoon-world#45) on GitHub Pages: https://clockgrove.github.io/raccoon-world/quality-lab/
# Kirk approved publishing the lab publicly (2026-11-11). It uses only the workflow's own token: no secrets.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out with Git LFS objects (Stevie and the props are LFS media)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Clockgrove's Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Fetch and install the pinned Clockgrove (its Three.js and Vite build the page)
        run: bash scripts/clockgrove.sh fetch

      - name: Build the quality lab as a static site
        run: node spikes/quality-lab/scripts/serve.mjs build --out _site/quality-lab

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}quality-lab/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
