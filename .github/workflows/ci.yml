name: CI

# The one required check. Until Raccoon World builds against Clockgrove (clockgrove/clockgrove#102
# adds that and its pack checks), it guards what this repository holds today: every Git LFS object
# is present and intact, and every file has licence metadata under REUSE 3.3.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out with Git LFS objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Check every LFS object is present and intact
        run: git lfs fsck --pointers --objects

      - name: Lint REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
