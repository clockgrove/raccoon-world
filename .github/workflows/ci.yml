name: CI

# The one required check: every Git LFS object is present and intact, every file has licence
# metadata under REUSE 3.3, and the world pack passes Clockgrove's world-pack check at the commit
# pinned in CLOCKGROVE_COMMIT (scripts/clockgrove.sh, the same command Factory and people run), and
# the art inputs pass Assetforge's checks and offline proof at ASSETFORGE_COMMIT (scripts/assetforge.sh).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out with Git LFS objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Check every LFS object is present and intact
        run: git lfs fsck --pointers --objects

      - name: Lint REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      # Clockgrove's own toolchain (its .github/actions/toolchain): this Node.js, pnpm through
      # Corepack. `scripts/clockgrove.sh check` fails when the pinned commit's engines.node differs.
      - name: Set up Clockgrove's Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Fetch and install the pinned Clockgrove
        run: bash scripts/clockgrove.sh fetch

      - name: Check the world pack against Clockgrove
        run: bash scripts/clockgrove.sh check

      # The slice takes about 7 of the job's 12 minutes on the software GPU. A change made only of
      # reference images and Markdown can't change what it draws, so it skips; anything else, any
      # model under references/stevie/77-3d or references/ceiling-3d, and every push to main runs it.
      - name: Decide whether the change can affect the 3D slice
        id: slice
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = push ] || [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 --no-tags origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$changed"
          other=$(printf '%s\n' "$changed" | grep -vE '^(references|docs)/.*\.(png|jpe?g|webp|md)$' || true)
          models=$(printf '%s\n' "$changed" | grep -E '^references/(stevie/77-3d|ceiling-3d)/' || true)
          if [ -z "$changed" ] || [ -n "$other$models" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Only reference images and Markdown changed: the slice is skipped."; fi

      - name: Draw the 3D look proof's slice on both backends (software GPU)
        if: steps.slice.outputs.run == 'true'
        run: bash scripts/clockgrove.sh slice

      # Raccoon World's art inputs against Assetforge at the commit pinned in ASSETFORGE_COMMIT: the
      # derived bible copy, the style profile match, the run forecasts and the offline proof. The model
      # provider is scripted (art/proof/provider.mjs), so no key is passed and nothing is spent.
      - name: Fetch and install the pinned Assetforge
        run: bash scripts/assetforge.sh fetch

      - name: Check the art inputs and run the offline art proof
        run: bash scripts/assetforge.sh check
