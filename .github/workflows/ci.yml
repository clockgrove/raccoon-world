name: CI

# The one required check: every Git LFS object is present and intact, every file has licence
# metadata under REUSE 3.3, and the world pack passes Clockgrove's world-pack check at the commit
# pinned in CLOCKGROVE_COMMIT (scripts/clockgrove.sh, the same command Factory and people run), and
# the art inputs pass Assetgrove's checks and offline proof at ASSETGROVE_COMMIT (scripts/assetgrove.sh),
# and the art passes Clockgrove's asset deploy gate (scripts/qualify.sh assets).
# The `visual` job captures the Wave 4 golden states and runs the S6 browser journey (#13); a manual
# run (workflow_dispatch) on main repeats the capture for the owner's digest comparison.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-26.04
    # The software-GPU slice alone takes 21–27 min on main since the lab's detail-level proofs (#113); 35 cancelled main mid-slice.
    timeout-minutes: 50
    steps:
      - name: Check out with Git LFS objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Check every LFS object is present and intact
        run: git lfs fsck --pointers --objects

      - name: Lint REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      # Clockgrove's own toolchain (its .github/actions/toolchain): this Node.js, pnpm through
      # Corepack. `scripts/clockgrove.sh check` fails when the pinned commit's engines.node differs.
      - name: Set up Clockgrove's Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Fetch and install the pinned Clockgrove
        run: bash scripts/clockgrove.sh fetch

      - name: Check the world pack against Clockgrove
        run: bash scripts/clockgrove.sh check

      # The pack check decodes each bound manifest but does not run the deploy gate: licence,
      # provenance and human review of every asset, assets/reviewed equal to a fresh build, a current
      # licence report and the approved golden scene.
      - name: Check the art against Clockgrove's asset gates
        run: bash scripts/qualify.sh assets

      # The slice takes about 7 of the job's 12 minutes on the software GPU. A change made only of
      # reference images and Markdown can't change what it draws, so it skips; anything else, any
      # model under references/stevie/77-3d or references/ceiling-3d, and every push to main runs it.
      - name: Decide whether the change can affect the 3D slice
        id: slice
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = push ] || [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 --no-tags origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$changed"
          other=$(printf '%s\n' "$changed" | grep -vE '^(references|docs)/.*\.(png|jpe?g|webp|md)$' || true)
          models=$(printf '%s\n' "$changed" | grep -E '^references/(stevie/77-3d|ceiling-3d)/' || true)
          if [ -z "$changed" ] || [ -n "$other$models" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Only reference images and Markdown changed: the slice is skipped."; fi

      - name: Draw the 3D look proof's slice on both backends (software GPU)
        if: steps.slice.outputs.run == 'true'
        run: bash scripts/clockgrove.sh slice

      # Raccoon World's art inputs against Assetgrove at the commit pinned in ASSETGROVE_COMMIT: the
      # derived bible copy, the style profile match, the run forecasts and the offline proof. The model
      # provider is scripted (art/proof/provider.mjs), so no key is passed and nothing is spent.
      - name: Fetch and install the pinned Assetgrove
        run: bash scripts/assetgrove.sh fetch

      - name: Check the art inputs and run the offline art proof
        run: bash scripts/assetgrove.sh check

  # Raccoon World's Wave 4 visual qualification (#13), beside `ci` so its browser runs don't share
  # ci's 50-minute limit. Captures are uploaded, never approved: approvals are committed by a person,
  # or by an agent on the owner's delegation, in tests/visual/approved-captures.json.
  visual:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out with Git LFS objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Clockgrove's Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Fetch and install the pinned Clockgrove
        run: bash scripts/clockgrove.sh fetch

      # The pinned checkout's own toolchain script: PostgreSQL 18.6, pgvector 0.8.7 and the system
      # packages its Playwright Chromium needs.
      - name: Install Clockgrove's PostgreSQL, pgvector and browser dependencies
        run: bash .clockgrove/scripts/ci/toolchain.sh postgresql pgvector browser-deps

      - name: Capture the golden states (both backends, three viewports)
        run: bash scripts/qualify.sh capture

      - name: Upload the captures for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raccoon-world-captures
          path: tests/visual/
          if-no-files-found: ignore

      # Independent of the capture: a capture failure (for example the known WebGL2 text-fringe
      # flip, clockgrove/clockgrove#361) still runs the journey.
      - name: Run the S6 browser journey
        if: ${{ !cancelled() }}
        run: bash scripts/qualify.sh journey
