# Dependabot PRs merge themselves: every hour this turns on auto-merge for each open Dependabot PR whose commits are
# all Dependabot's, pinned to the head it checked; the merge queue and the required checks still decide. It runs on a
# schedule on the default branch, never on a pull_request event, and checks out no PR code: Factory refuses any
# PR-triggered job holding a write token. Part of the clockgrove repository standard (~/work/ops/repo-standard.sh).
name: Dependabot auto-merge
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: dependabot-automerge
jobs:
  automerge:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Turn on auto-merge for each Dependabot PR
        run: |
          for pr in $(gh pr list --author app/dependabot --state open --json number,isDraft,isCrossRepository \
              --jq '.[] | select((.isDraft | not) and (.isCrossRepository | not)) | .number'); do
            info=$(gh pr view "$pr" --json headRefOid,autoMergeRequest,commits)
            head=$(jq -r .headRefOid <<<"$info")
            others=$(jq '[.commits[].authors[].login | select(. != "dependabot[bot]" and . != "dependabot")] | length' <<<"$info")
            if [ "$others" != 0 ]; then echo "#$pr has commits from someone other than Dependabot; skipped"; continue; fi
            if [ "$(jq '.autoMergeRequest != null' <<<"$info")" = true ]; then echo "#$pr already set"; continue; fi
            gh pr merge "$pr" --auto --squash --match-head-commit "$head" || echo "::warning::#$pr: auto-merge not set"
          done
