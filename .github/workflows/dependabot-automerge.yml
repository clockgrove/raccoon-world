# Dependabot PRs merge themselves: this turns on auto-merge, and the merge queue and the required checks still decide.
# fetch-metadata refuses a PR whose commits are not Dependabot's, so a push by anyone else to its branch stops here.
# Part of the clockgrove repository standard (~/work/ops/repo-standard.sh).
name: Dependabot auto-merge
on: pull_request
permissions: {}
jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
      - name: Queue the PR once the required checks pass
        run: |
          echo "$UPDATE_TYPE update of $DEPS"
          gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
