<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Raccoon World: quality lab</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14130e; }
    #scene, canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #status, #credit { position: absolute; right: 8px; margin: 0; color: #e8e8ea; font: 11px system-ui, sans-serif; opacity: .7; text-align: right; }
    #status { bottom: 24px; }
    #credit { bottom: 6px; }
    #credit a { color: inherit; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading the yard</p>
  <div id="scene" aria-label="Raccoon World quality lab: the yard in rain with Stevie walking a loop"></div>
  <div id="ui"></div>
  <p id="credit">Props: 3D models generated with Meshy (meshy.ai) and Tripo (tripo3d.ai), <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Stevie and the page: MIT.</p>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
